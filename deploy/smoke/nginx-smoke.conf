# Smoke-test server: plain HTTP on :80 with the same proxy snippet as production (TLS is not part of this test).
upstream food_lens_web {
    server web:3000;
    keepalive 8;
}

upstream food_lens_api {
    server api:8000;
    keepalive 8;
}

server {
    listen 80;
    error_log /var/log/nginx/error.log info;   # temp-file buffering is reported at "warn"

    include /etc/nginx/snippets/food-lens-proxy.conf;
}
