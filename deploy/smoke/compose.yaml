# Local smoke test: the production containers behind Nginx 1.24.0 with the production proxy snippet.
# Run deploy/smoke/check.sh. Own project name, ports and container names; the real run folder is mounted read-only.
name: food-lens-smoke

services:
  api:
    extends:
      file: ../../compose.yaml
      service: api
    container_name: food-lens-smoke-api
    ports: !reset []

  web:
    extends:
      file: ../../compose.yaml
      service: web
    container_name: food-lens-smoke-web
    depends_on:
      api:
        condition: service_healthy
    ports: !reset []

  nginx:
    image: nginx:1.24.0-alpine@sha256:77e5d4a6ad906c5d3793764085706577fa705b1dc6f244ea0241c4b5e2155385
    container_name: food-lens-smoke-nginx
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "127.0.0.1:18085:80"
    volumes:
      - ../nginx/food-lens-proxy.conf:/etc/nginx/snippets/food-lens-proxy.conf:ro
      - ./nginx-smoke.conf:/etc/nginx/conf.d/default.conf:ro
