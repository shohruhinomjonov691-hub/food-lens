# Food Lens — request-rate and connection limits for the API paths (http context).
# Install as /etc/nginx/snippets/food-lens-limits.conf and include it at the TOP of conf.d/food-lens.conf, outside any
# server block (limit_req_zone / limit_conn_zone / map are only valid in "http"; conf.d/*.conf is included there).
# food-lens-proxy.conf applies the zones to `location /api/`. Limits are per client IP ($binary_remote_addr). This Nginx
# is the edge, so the address is the real client. Behind a CDN or proxy, set the real client address first (ngx_http_realip_module),
# otherwise every visitor shares one address.
#
# Why two request zones: reading ingredients is cheap, but every POST (photo analysis, extra check) decodes an image
# and runs the model or calls a paid service. Only POST requests get a key for the strict zone; an empty key is not counted.
# Unique names (food_lens_*) so they cannot clash with the other sites in conf.d.

map $request_method $food_lens_upload_key {
    POST    $binary_remote_addr;
    default "";
}

limit_req_zone $food_lens_upload_key zone=food_lens_upload:5m rate=12r/m;   # photo analysis and extra check
limit_req_zone $binary_remote_addr   zone=food_lens_api:5m    rate=120r/m;  # every /api/ request (ingredients, health, ...)
limit_conn_zone $binary_remote_addr  zone=food_lens_conn:5m;                # simultaneous /api/ requests (also slow uploads)
