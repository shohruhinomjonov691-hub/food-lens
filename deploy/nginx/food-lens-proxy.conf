# Food Lens — proxy rules for the existing Nginx (include inside the app's server block).
# Used unchanged by deploy/smoke/, which checks that no image bytes touch the proxy's disk.
#
# One domain: /api/ goes straight to the FastAPI container, everything else to the Next.js container. The browser
# only requests relative /api/... URLs, so no API host or port appears in the frontend.
#
# Uploaded photos must never be written to disk, so request and response buffering to temporary files is off.

client_max_body_size 11m;          # the API itself rejects anything over 10 MB with 413
client_body_buffer_size 11m;       # keep any held body in memory
client_body_in_file_only off;
proxy_request_buffering off;       # stream request bodies; no temp file
proxy_buffering off;               # stream responses; no proxy_temp file
proxy_max_temp_file_size 0;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_read_timeout 60s;
proxy_send_timeout 60s;

# Both apps set nosniff and Referrer-Policy; the API sets Cache-Control: no-store on /api/. Not overridden here.

location /api/ {
    proxy_pass http://food_lens_api;
}

location / {
    proxy_pass http://food_lens_web;
}

# Hashed, immutable Next.js build assets.
location /_next/static/ {
    proxy_pass http://food_lens_web;
    expires 30d;
}
