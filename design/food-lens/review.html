<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mockup review</title>
<link rel="icon" href="data:,">
<!-- Design-review tool only. Never ship this page or its controls in the app. -->
<style>
:root { color-scheme: light; }
body { margin: 0; background: #e9e1d6; color: #2b2118; font: 13px/1.5 ui-sans-serif, system-ui, sans-serif; }
.bar { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; padding: 8px 16px; border-bottom: 1px dashed #b9a487; background: #f6efe5; }
.group { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
button { font: inherit; border: 1px solid #b9a487; background: transparent; color: #2b2118; border-radius: 6px; padding: 2px 8px; cursor: pointer; }
button[aria-pressed="true"] { background: #2b2118; color: #fff; border-color: #2b2118; }
.frame { display: flex; justify-content: center; padding: 16px; }
iframe { border: 1px solid #d3c3ad; border-radius: 10px; background: #fbf6ef; width: 100%; height: calc(100vh - 110px); }
.mobile iframe { width: 390px; height: 844px; }
</style>
</head>
<body>
<div class="bar">
  <b>MOCKUP REVIEW</b><span>Fake data — no upload or model.</span>
  <span class="group" data-key="state">State:
    <button data-v="empty">empty</button><button data-v="crop">crop</button><button data-v="loading">loading</button>
    <button data-v="result">result</button><button data-v="uncertain">uncertain</button><button data-v="confirmed">confirmed</button>
    <button data-v="error-file">bad file</button><button data-v="error-server">server error</button>
  </span>
  <span class="group" data-key="lang">Lang: <button data-v="">saved</button><button data-v="en">EN</button><button data-v="ko">KO</button></span>
  <span class="group" data-key="size">Size: <button data-v="desktop">desktop</button><button data-v="mobile">390 px</button></span>
</div>
<div class="frame" id="frame"><iframe id="app" title="Food Lens mockup"></iframe></div>
<script>
"use strict";
const opts = { state: "result", lang: "", size: "desktop" };
function update() {
  document.querySelectorAll(".group").forEach((g) =>
    g.querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", String(opts[g.dataset.key] === b.dataset.v))));
  document.getElementById("frame").className = "frame " + opts.size;
  const p = new URLSearchParams();
  for (const k of ["state", "lang"]) if (opts[k]) p.set(k, opts[k]);
  document.getElementById("app").src = "mockup.html#" + p.toString();
}
document.querySelectorAll(".group").forEach((g) =>
  g.addEventListener("click", (e) => {
    if (e.target.tagName !== "BUTTON") return;
    opts[g.dataset.key] = e.target.dataset.v;
    update();
  }));
update();
</script>
</body>
</html>
